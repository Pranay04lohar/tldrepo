[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tldrepo"
version = "0.1.0"
description = "A fast, local-AI codebase map for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
]

[project.scripts]
tldrepo = "tldrepo.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tldrepo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
